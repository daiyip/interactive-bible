<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Interactive Bible</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Bible">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fefefc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1d21" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <svg class="bar-logo" viewBox="9 17 82 72" width="26" height="23" aria-hidden="true"><path d="M50 28C40 21 25 19 12 21V79C25 77 40 79 50 86Z" fill="currentColor" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/><path d="M50 28C60 21 75 19 88 21V79C75 77 60 79 50 86" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/><path d="M20 38C29 37.5 36 39 42 42M20 51C29 50.5 36 52 42 55M20 64C29 63.5 36 65 42 68" fill="none" stroke="var(--panel)" stroke-width="4.5" stroke-linecap="round"/><path d="M80 38C71 37.5 64 39 58 42M80 51C71 50.5 64 52 58 55M80 64C71 63.5 64 65 58 68" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
  <button id="picker-btn" class="title-btn" aria-haspopup="dialog"><span id="ref-title">…</span><span class="caret">▾</span></button>
  <div class="ver-wrap">
    <button id="version" class="badge ver-btn" data-i18n-title="version" title="Translation" aria-label="Translation" aria-haspopup="menu" aria-expanded="false"><span id="version-name">KJV</span><span class="caret">▾</span></button>
    <div id="version-menu" class="size-menu ver-menu" role="menu" hidden></div>
  </div>
  <div class="nav">
    <button id="prev" class="icon" data-i18n-title="prevCh" title="Previous chapter (←)" aria-label="Previous chapter (←)">‹</button>
    <button id="next" class="icon" data-i18n-title="nextCh" title="Next chapter (→)" aria-label="Next chapter (→)">›</button>
  </div>
  <span class="spacer"></span>
  <button id="search-btn" class="icon" data-i18n-title="search" title="Search (/)" aria-label="Search (/)" aria-haspopup="dialog"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <div class="size-wrap">
    <button id="size-btn" class="icon" data-i18n-title="textSize" title="Text size" aria-label="Text size" aria-haspopup="menu" aria-expanded="false">Aa<span class="caret">▾</span></button>
    <div id="size-menu" class="size-menu" role="menu" hidden></div>
  </div>
  <button id="share-btn" class="icon share-btn" data-i18n-title="share" title="Share this view" aria-label="Share this view"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 10V2.2M5 5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 7.5H3.8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</header>

<main class="panels">
  <section id="reader" class="reader" aria-label="Reading panel">
    <div id="tour" class="tour" aria-live="polite" hidden>
      <div class="tour-head">
        <b id="tour-title"></b><span id="tour-count" class="count"></span>
        <button id="tour-x" class="icon" data-i18n-title="endTour" title="End tour" aria-label="End tour">×</button>
      </div>
      <p><span id="tour-year" class="tour-year"></span> <span id="tour-text"></span></p>
      <div class="tour-bar"><i id="tour-progress"></i></div>
      <div class="tour-ctl">
        <button id="tour-prev" class="pill" data-i18n="back">‹ Back</button>
        <button id="tour-play" class="pill" aria-pressed="false" data-i18n="play" data-i18n-title="playTitle" title="Play the tour">▶ Play</button>
        <a id="tour-map" class="pill" target="_blank" rel="noopener" data-i18n="map" data-i18n-title="mapTitle" title="Follow this step on the atlas map">Map ↗</a>
        <button id="tour-next" class="pill">Next ›</button>
      </div>
    </div>
    <article id="chapter" class="chapter"></article>
    <footer class="chapter-foot">
      <button id="prev2" class="pill">‹ <span></span></button>
      <button id="next2" class="pill"><span></span> ›</button>
    </footer>
    <p class="credit" id="credit">King James Version, public domain. Cross-references from <a href="https://www.openbible.info/labs/cross-references/" target="_blank" rel="noopener">OpenBible.info</a> (CC BY). People, places and events from <a href="https://github.com/robertrouse/theographic-bible-metadata" target="_blank" rel="noopener">Theographic</a> (CC BY-SA). Map from Natural Earth.</p>
    <div class="dock-wrap">
      <div id="timeline-card" class="timeline-card" hidden>
        <button id="tl-now" class="tl-now"><b id="tl-era"></b> <span id="tl-year"></span></button>
        <nav id="timeline" class="timeline" aria-label="Timeline"></nav>
      </div>
      <div id="listen-bar" class="listen-bar" role="toolbar" hidden>
        <button id="listen-prev" class="icon" data-i18n-title="listenPrev" title="Previous verse" aria-label="Previous verse"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 3.5v9M12.5 3.5v9L5.5 8Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button id="listen-pp" class="icon listen-pp"></button>
        <button id="listen-next" class="icon" data-i18n-title="listenNext" title="Next verse" aria-label="Next verse"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M12.5 3.5v9M3.5 3.5v9L10.5 8Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <span id="listen-ref" class="listen-ref"></span>
        <button id="listen-voice" class="icon listen-voice" data-i18n-title="listenVoice" title="Voice" aria-label="Voice" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="5.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 14c.6-2.8 2.6-4.2 5-4.2s4.4 1.4 5 4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span id="listen-voice-name"></span></button>
        <div id="voice-menu" class="voice-menu" role="menu" hidden></div>
        <button id="listen-rate" class="icon listen-rate" data-i18n-title="listenRate" title="Reading speed" aria-label="Reading speed">1×</button>
        <button id="listen-x" class="icon" data-i18n-title="listenStop" title="Stop reading" aria-label="Stop reading">×</button>
      </div>
      <div class="dock" role="toolbar">
        <button id="chapter-btn" aria-pressed="false" data-i18n-title="chapterTitle" title="Cross-references, people and places of the whole chapter"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span data-i18n="chapterBtn">Context</span></button>
        <button id="listen-btn" aria-pressed="false" data-i18n-title="listenTitle" title="Read this chapter aloud" hidden><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.6 5.6a3.2 3.2 0 0 1 0 4.8M12.4 3.8a5.8 5.8 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="listen">Listen</span></button>
        <button id="timeline-btn" aria-pressed="false" data-i18n-title="timelineTitle" title="Where this is in Bible history"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.5 8h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="4" cy="8" r="1.6" fill="currentColor"/><circle cx="12" cy="8" r="1.6" fill="currentColor"/><path d="M8 3.5v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="timeline">Timeline</span></button>
        <button id="tours-btn" aria-haspopup="dialog"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3.5" cy="12.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12.5" cy="3.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 12.5H10a2.25 2.25 0 0 0 0-4.5H6a2.25 2.25 0 0 1 0-4.5h4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span data-i18n="tours">Tours</span></button>
        <button id="mine-btn" aria-haspopup="dialog"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.5h8v11.2L8 10.6l-4 3.1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span data-i18n="mine">My reading</span></button>
      </div>
    </div>
  </section>

  <aside id="context" class="context" aria-label="Context panel">
    <div class="sheet-handle" id="sheet-handle" data-i18n-title="sheetHandle" title="Drag or tap to resize"><span></span></div>
    <div id="ctx-empty" class="ctx-empty">
      <picture class="ctx-logo">
        <source media="(prefers-color-scheme: dark)" srcset="img/logo-white.svg">
        <img src="img/logo.svg" width="56" height="56" alt="">
      </picture>
      <p class="hint-title" data-i18n="tapVerse">Tap a verse</p>
      <p data-i18n="tapHint">Its cross-references, people, places and links show up here.</p>
      <button id="ctx-chapter" class="pill"></button>
      <p class="hint-title tours-hint" data-i18n="readingPlan">Reading plan</p>
      <div id="ctx-today" class="tour-list"></div>
      <p class="hint-title tours-hint" data-i18n="orTour">Or take a tour</p>
      <div id="ctx-tours" class="tour-list"></div>
    </div>
    <div id="ctx-body" hidden>
      <div class="ctx-head">
        <div class="ctx-title"><h2 id="ctx-ref"></h2><button id="sheet-x" class="icon" data-i18n-title="close" title="Close" aria-label="Close">×</button></div>
        <div id="ctx-scope" class="seg ctx-scope" hidden></div>
        <blockquote id="ctx-text"></blockquote>
        <details id="ctx-orig" class="ctx-orig" hidden></details>
        <details id="ctx-harmony" class="ctx-orig ctx-harmony" hidden></details>
        <details id="ctx-topics" class="ctx-orig ctx-topics" hidden></details>
        <div id="ctx-mark" class="ctx-mark"></div>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="xref" aria-selected="true"><span data-i18n="xref">Cross-references</span> <span id="xref-count" class="count"></span></button>
        <button role="tab" data-tab="people" aria-selected="false"><span data-i18n="people">People</span> <span id="people-count" class="count"></span></button>
        <button role="tab" data-tab="places" aria-selected="false"><span data-i18n="places">Places</span> <span id="places-count" class="count"></span></button>
        <button role="tab" data-tab="links" aria-selected="false"><span data-i18n="links">Links</span></button>
      </nav>
      <div id="tab-xref" class="tab-pane"></div>
      <div id="tab-people" class="tab-pane" hidden></div>
      <div id="tab-places" class="tab-pane" hidden>
        <p id="places-note" class="note small"></p>
        <div id="map-box" class="map-box"><div id="map-fallback"></div></div>
        <div id="places-body"></div>
      </div>
      <div id="tab-links" class="tab-pane" hidden></div>
    </div>
  </aside>
</main>

<dialog id="picker" class="picker">
  <div class="picker-head">
    <button id="picker-back" class="icon" hidden data-i18n-title="backBooks" aria-label="Back to books">‹</button>
    <h2 id="picker-title">Books</h2>
    <button id="picker-share" class="icon share-btn" data-i18n-title="share" title="Share this view" aria-label="Share this view"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 10V2.2M5 5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 7.5H3.8a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button id="picker-x" class="icon" data-i18n-title="close" aria-label="Close">×</button>
  </div>
  <div id="picker-body"></div>
</dialog>

<dialog id="search" class="picker search">
  <div class="picker-head">
    <input id="search-q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-i18n-ph="searchPh" placeholder="Search" aria-label="Search">
    <button id="search-x" class="icon" data-i18n-title="close" aria-label="Close">×</button>
  </div>
  <div id="search-results" class="search-results" aria-live="polite"></div>
</dialog>

<dialog id="mine" class="picker mine">
  <div class="picker-head">
    <div class="seg" role="group">
      <button data-mine="plan" data-i18n="plan" aria-pressed="true">Plan</button>
      <button data-mine="marks" data-i18n="marks" aria-pressed="false">Highlights</button>
    </div>
    <span class="spacer"></span>
    <button id="mine-x" class="icon" data-i18n-title="close" aria-label="Close">×</button>
  </div>
  <div id="mine-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
